# One grouped pull request per ecosystem per month. Grouping also keeps
# packages that must move together (for example opentelemetry-sdk and its
# exporter) in a single update. Security updates are not held back by the
# schedule. Merge these by squashing or applying the changes by hand.
version: 2
updates:
  - package-ecosystem: pip
    directories:
      - /services/ingestion
      - /services/stream-processor
      - /services/anomaly-detector
      - /services/alert-service
      - /services/api
      - /simulator
      - /scripts/seed
      - /tests
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      python-dependencies:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      npm-dependencies:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directories:
      - /frontend
      - /infrastructure/docker/migrate
      - /scripts/seed
      - /services/alert-service
      - /services/anomaly-detector
      - /services/api
      - /services/ingestion
      - /services/stream-processor
      - /simulator
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      docker-images:
        patterns: ["*"]
