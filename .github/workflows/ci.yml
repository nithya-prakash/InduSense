name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-actions:
    name: Lint workflow files
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: reviewdog/action-actionlint@v1
        with:
          fail_level: error

  # A compile-check, not a real linter: ruff/mypy aren't configured yet
  # (see the migration plan's deferred future-phases list) -- this only
  # catches syntax errors, the Python equivalent of `go build` failing.
  # Add ruff/mypy as their own job once they're actually adopted, rather
  # than bolting on default configs here as a side effect of removing Go.
  compile-check-python:
    name: Python compile check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m compileall -q shared services simulator scripts/seed tests

  pip-audit:
    name: Python dependency vulnerability scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        requirements:
          - services/ingestion/requirements.txt
          - services/stream-processor/requirements.txt
          - services/anomaly-detector/requirements.txt
          - services/alert-service/requirements.txt
          - services/api/requirements.txt
          - simulator/requirements.txt
          - scripts/seed/requirements.txt
          - tests/requirements.txt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q pip-audit
      - run: pip-audit -r ${{ matrix.requirements }}

  lint-frontend:
    name: Frontend lint / build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  lint-helm:
    name: Helm chart lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: helm lint infrastructure/helm/indusense

  unit-test:
    name: Python unit tests (no external services required)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [compile-check-python]
    steps:
      - uses: actions/checkout@v4
      - run: make unit-test

  test:
    name: Test suite (real infra via docker compose)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [compile-check-python]
    steps:
      - uses: actions/checkout@v4

      - name: Configure environment
        run: make setup

      - name: Start infra, migrate, start app services (make up)
        run: make up

      - name: Seed demo data
        run: make seed

      - name: Run contract, integration, and e2e suites against the real stack
        run: |
          make contract-test
          make integration-test
          make e2e-test

      - name: Dump service logs on failure
        if: failure()
        run: docker compose logs --tail=200

      - name: Tear down
        if: always()
        run: docker compose down -v

  # Builds and pushes every service image to GHCR — the closest thing this
  # portfolio project has to "CD": there's no live remote environment to
  # deploy the Helm chart into, so publishing versioned, pullable images is
  # the honest scope for continuous delivery here, not a fabricated deploy
  # step against infrastructure that doesn't exist. `helm install` against
  # a real cluster (Phase 14) already proves the chart can consume exactly
  # these image names once someone points `images.*.repository` at ghcr.io.
  publish-images:
    name: Build and push images to GHCR
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [unit-test, lint-frontend, lint-helm, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: ingestion
            context: .
            dockerfile: services/ingestion/Dockerfile
          - image: stream-processor
            context: .
            dockerfile: services/stream-processor/Dockerfile
          - image: anomaly-detector
            context: .
            dockerfile: services/anomaly-detector/Dockerfile
          - image: alert-service
            context: .
            dockerfile: services/alert-service/Dockerfile
          - image: api
            context: .
            dockerfile: services/api/Dockerfile
          - image: migrate
            context: .
            dockerfile: infrastructure/docker/migrate/Dockerfile
          - image: seed
            context: .
            dockerfile: scripts/seed/Dockerfile
          - image: frontend
            context: ./frontend
            dockerfile: frontend/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # GITHUB_TOKEN's package-write permission wasn't taking effect
          # against ghcr.io for this repo even with the repo-level
          # "Read and write permissions" default set correctly (fresh
          # runs still got permission_denied: write_package) -- a
          # classic PAT with the write:packages scope sidesteps that
          # entirely, since its permissions don't depend on the repo's
          # Actions default at all.
          password: ${{ secrets.GHCR_PAT }}
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/indusense-${{ matrix.image }}:latest
            ghcr.io/${{ github.repository_owner }}/indusense-${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
