name: indusense

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ---------------------------------------------------------------------------
  # Infrastructure — Phase 1
  # ---------------------------------------------------------------------------

  postgres:
    image: postgres:16-alpine
    container_name: indusense-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-indusense}
      POSTGRES_USER: ${POSTGRES_USER:-indusense}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-indusense_dev_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-indusense} -d ${POSTGRES_DB:-indusense}"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging: *default-logging
    networks: [indusense-net]

  redis:
    image: redis:7-alpine
    container_name: indusense-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging: *default-logging
    networks: [indusense-net]

  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: indusense-mosquitto
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./infrastructure/docker/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data
      - mosquitto-log:/mosquitto/log
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -t '$$SYS/#' -C 1 -i healthcheck -W 3 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging: *default-logging
    networks: [indusense-net]

  kafka:
    image: apache/kafka:3.7.0
    container_name: indusense-kafka
    ports:
      - "9092:9092"
      - "9094:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      CLUSTER_ID: SGpTVXBRVE8yc2hSXzFDQg
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_NUM_PARTITIONS: 12
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 15
    logging: *default-logging
    networks: [indusense-net]

  kafka-init-topics:
    image: apache/kafka:3.7.0
    container_name: indusense-kafka-init-topics
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./infrastructure/docker/kafka-init-topics.sh:/kafka-init-topics.sh:ro
    entrypoint: ["/bin/bash", "/kafka-init-topics.sh"]
    networks: [indusense-net]

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: indusense-kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8089:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: indusense
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    logging: *default-logging
    networks: [indusense-net]

  influxdb:
    image: influxdb:2.7-alpine
    container_name: indusense-influxdb
    ports:
      - "8086:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUXDB_ADMIN_USER:-admin}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUXDB_ADMIN_PASSWORD:-indusense_dev_password}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUXDB_ORG:-indusense}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUXDB_BUCKET:-telemetry}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUXDB_TOKEN:-dev-only-influx-admin-token-change-me}
    volumes:
      - influxdb-data:/var/lib/influxdb2
      - influxdb-config:/etc/influxdb2
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8086/health"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging: *default-logging
    networks: [indusense-net]

networks:
  indusense-net:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  mosquitto-data:
  mosquitto-log:
  kafka-data:
  influxdb-data:
  influxdb-config:
