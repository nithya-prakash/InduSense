name: indusense

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ---------------------------------------------------------------------------
  # Infrastructure — Phase 1
  # ---------------------------------------------------------------------------

  postgres:
    image: postgres:16-alpine
    container_name: indusense-postgres
    mem_limit: 1g
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-indusense}
      POSTGRES_USER: ${POSTGRES_USER:-indusense}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-indusense_dev_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-indusense} -d ${POSTGRES_DB:-indusense}"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging: *default-logging
    networks: [indusense-net]

  redis:
    image: redis:7-alpine
    container_name: indusense-redis
    mem_limit: 512m
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging: *default-logging
    networks: [indusense-net]

  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: indusense-mosquitto
    mem_limit: 256m
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./infrastructure/docker/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data
      - mosquitto-log:/mosquitto/log
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -t '$$SYS/#' -C 1 -i healthcheck -W 3 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging: *default-logging
    networks: [indusense-net]

  kafka:
    image: apache/kafka:3.7.0
    container_name: indusense-kafka
    mem_limit: 2g
    ports:
      - "9092:9092"
      - "9094:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      CLUSTER_ID: SGpTVXBRVE8yc2hSXzFDQg
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_NUM_PARTITIONS: 12
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 15
    logging: *default-logging
    networks: [indusense-net]

  kafka-init-topics:
    image: apache/kafka:3.7.0
    container_name: indusense-kafka-init-topics
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./infrastructure/docker/kafka-init-topics.sh:/kafka-init-topics.sh:ro
    entrypoint: ["/bin/bash", "/kafka-init-topics.sh"]
    networks: [indusense-net]

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: indusense-kafka-ui
    mem_limit: 768m
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8089:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: indusense
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    logging: *default-logging
    networks: [indusense-net]

  influxdb:
    image: influxdb:2.7-alpine
    container_name: indusense-influxdb
    mem_limit: 1g
    ports:
      - "8086:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUXDB_ADMIN_USER:-admin}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUXDB_ADMIN_PASSWORD:-indusense_dev_password}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUXDB_ORG:-indusense}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUXDB_BUCKET:-telemetry}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUXDB_TOKEN:-dev-only-influx-admin-token-change-me}
      # Applies only on first-time setup (fresh influxdb-data volume) — see
      # "Telemetry retention" in the README for how to apply this to an
      # already-initialized bucket via `influx bucket update`.
      DOCKER_INFLUXDB_INIT_RETENTION: ${INFLUXDB_RETENTION:-720h}
    volumes:
      - influxdb-data:/var/lib/influxdb2
      - influxdb-config:/etc/influxdb2
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8086/health"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging: *default-logging
    networks: [indusense-net]

  # ---------------------------------------------------------------------------
  # Application services — Phase 4+
  # ---------------------------------------------------------------------------

  ingestion:
    build:
      context: .
      dockerfile: services/ingestion/Dockerfile
    container_name: indusense-ingestion
    mem_limit: 512m
    ports:
      - "8081:8081"
    environment:
      MQTT_BROKER_HOST: mosquitto
      MQTT_BROKER_PORT: "1883"
      MQTT_CLIENT_ID_PREFIX: ${MQTT_CLIENT_ID_PREFIX:-indusense}
      MQTT_QOS: ${MQTT_QOS:-1}
      KAFKA_BROKERS: kafka:9092
      KAFKA_TOPIC_TELEMETRY_RAW: ${KAFKA_TOPIC_TELEMETRY_RAW:-telemetry.raw}
      KAFKA_TOPIC_DEVICE_EVENTS: ${KAFKA_TOPIC_DEVICE_EVENTS:-device.events}
      KAFKA_TOPIC_DEAD_LETTER: ${KAFKA_TOPIC_DEAD_LETTER:-dead-letter}
      INGESTION_WORKER_POOL_SIZE: ${INGESTION_WORKER_POOL_SIZE:-50}
      INGESTION_QUEUE_CAPACITY: ${INGESTION_QUEUE_CAPACITY:-10000}
      INGESTION_PORT: ${INGESTION_PORT:-8081}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    depends_on:
      mosquitto:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init-topics:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/live"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging: *default-logging
    networks: [indusense-net]

  stream-processor:
    build:
      context: .
      dockerfile: services/stream-processor/Dockerfile
    container_name: indusense-stream-processor
    mem_limit: 512m
    ports:
      - "8082:8082"
    environment:
      KAFKA_BROKERS: kafka:9092
      KAFKA_CONSUMER_GROUP_PREFIX: ${MQTT_CLIENT_ID_PREFIX:-indusense}
      KAFKA_TOPIC_TELEMETRY_RAW: ${KAFKA_TOPIC_TELEMETRY_RAW:-telemetry.raw}
      KAFKA_TOPIC_TELEMETRY_PROCESSED: ${KAFKA_TOPIC_TELEMETRY_PROCESSED:-telemetry.processed}
      KAFKA_TOPIC_DEAD_LETTER: ${KAFKA_TOPIC_DEAD_LETTER:-dead-letter}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      INFLUXDB_URL: http://influxdb:8086
      INFLUXDB_TOKEN: ${INFLUXDB_TOKEN:-dev-only-influx-admin-token-change-me}
      INFLUXDB_ORG: ${INFLUXDB_ORG:-indusense}
      INFLUXDB_BUCKET: ${INFLUXDB_BUCKET:-telemetry}
      STREAM_PROCESSOR_PORT: "8082"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init-topics:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      influxdb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8082/live"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging: *default-logging
    networks: [indusense-net]

  anomaly-detector:
    build:
      context: .
      dockerfile: services/anomaly-detector/Dockerfile
    container_name: indusense-anomaly-detector
    mem_limit: 512m
    ports:
      - "8083:8083"
    environment:
      KAFKA_BROKERS: kafka:9092
      KAFKA_CONSUMER_GROUP_PREFIX: ${MQTT_CLIENT_ID_PREFIX:-indusense}
      KAFKA_TOPIC_TELEMETRY_PROCESSED: ${KAFKA_TOPIC_TELEMETRY_PROCESSED:-telemetry.processed}
      KAFKA_TOPIC_ANOMALIES_DETECTED: ${KAFKA_TOPIC_ANOMALIES_DETECTED:-anomalies.detected}
      KAFKA_TOPIC_DEAD_LETTER: ${KAFKA_TOPIC_DEAD_LETTER:-dead-letter}
      ANOMALY_POSTGRES_DSN: postgres://${POSTGRES_USER:-indusense}:${POSTGRES_PASSWORD:-indusense_dev_password}@postgres:5432/${POSTGRES_DB:-indusense}?sslmode=disable
      ANOMALY_POSTGRES_MAX_CONNS: ${ANOMALY_POSTGRES_MAX_CONNS:-5}
      ANOMALY_DETECTOR_PORT: "8083"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init-topics:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8083/live"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging: *default-logging
    networks: [indusense-net]

  alert-service:
    build:
      context: .
      dockerfile: services/alert-service/Dockerfile
    container_name: indusense-alert-service
    mem_limit: 512m
    ports:
      - "8084:8084"
    environment:
      KAFKA_BROKERS: kafka:9092
      KAFKA_CONSUMER_GROUP_PREFIX: ${MQTT_CLIENT_ID_PREFIX:-indusense}
      KAFKA_TOPIC_ANOMALIES_DETECTED: ${KAFKA_TOPIC_ANOMALIES_DETECTED:-anomalies.detected}
      KAFKA_TOPIC_DEVICE_EVENTS: ${KAFKA_TOPIC_DEVICE_EVENTS:-device.events}
      KAFKA_TOPIC_ALERTS: ${KAFKA_TOPIC_ALERTS:-alerts}
      KAFKA_TOPIC_DEAD_LETTER: ${KAFKA_TOPIC_DEAD_LETTER:-dead-letter}
      ALERT_POSTGRES_DSN: postgres://${POSTGRES_USER:-indusense}:${POSTGRES_PASSWORD:-indusense_dev_password}@postgres:5432/${POSTGRES_DB:-indusense}?sslmode=disable
      ALERT_POSTGRES_MAX_CONNS: ${ALERT_POSTGRES_MAX_CONNS:-10}
      ALERT_SERVICE_PORT: "8084"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init-topics:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8084/live"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging: *default-logging
    networks: [indusense-net]

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    container_name: indusense-api
    mem_limit: 512m
    ports:
      - "8080:8080"
    environment:
      API_PORT: "8080"
      API_POSTGRES_DSN: postgres://${POSTGRES_USER:-indusense}:${POSTGRES_PASSWORD:-indusense_dev_password}@postgres:5432/${POSTGRES_DB:-indusense}?sslmode=disable
      API_POSTGRES_MAX_CONNS: ${API_POSTGRES_MAX_CONNS:-10}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      INFLUXDB_URL: http://influxdb:8086
      INFLUXDB_TOKEN: ${INFLUXDB_TOKEN:-dev-only-influx-admin-token-change-me}
      INFLUXDB_ORG: ${INFLUXDB_ORG:-indusense}
      INFLUXDB_BUCKET: ${INFLUXDB_BUCKET:-telemetry}
      KAFKA_BROKERS: kafka:9092
      KAFKA_TOPIC_ALERTS: ${KAFKA_TOPIC_ALERTS:-alerts}
      MQTT_BROKER_URL: tcp://mosquitto:1883
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-change-me-dev-only-access-secret}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change-me-dev-only-refresh-secret}
      JWT_ACCESS_TTL_MINUTES: ${JWT_ACCESS_TTL_MINUTES:-15}
      JWT_REFRESH_TTL_HOURS: ${JWT_REFRESH_TTL_HOURS:-168}
      API_CORS_ALLOWED_ORIGINS: ${API_CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      # 30, not the code default of 10: this compose stack is what the test
      # suite (tests/integration, tests/e2e) runs against, and every test
      # in that suite now legitimately shares one real-IP "auth" bucket
      # (X-Forwarded-For is correctly no longer trusted for this — see
      # services/api/middleware.go's clientIPResolver). 30/min is still a
      # real, meaningful brute-force defense (1800 guesses/hour cap) while
      # comfortably covering the suite's ~7 real logins per full run.
      API_RATE_LIMIT_AUTH_PER_MIN: ${API_RATE_LIMIT_AUTH_PER_MIN:-30}
      API_RATE_LIMIT_DEFAULT_PER_MIN: ${API_RATE_LIMIT_DEFAULT_PER_MIN:-120}
      # Secure by default: X-Forwarded-For is never trusted unless this is
      # explicitly enabled AND the connecting peer is in
      # API_TRUSTED_PROXY_CIDRS (comma-separated IPs/CIDRs) — e.g. your
      # ingress/load balancer's address. Never set this true without also
      # setting the CIDR list, and never trust a CIDR range wider than your
      # actual proxy's address, or any direct client can spoof its way past
      # rate limiting again.
      API_TRUST_PROXY_HEADERS: ${API_TRUST_PROXY_HEADERS:-false}
      API_TRUSTED_PROXY_CIDRS: ${API_TRUSTED_PROXY_CIDRS:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      influxdb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/live"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging: *default-logging
    networks: [indusense-net]

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: indusense-prometheus
    mem_limit: 512m
    ports:
      - "9090:9090"
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    logging: *default-logging
    networks: [indusense-net]

  grafana:
    image: grafana/grafana:11.3.1
    container_name: indusense-grafana
    mem_limit: 512m
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./infrastructure/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infrastructure/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    logging: *default-logging
    networks: [indusense-net]

  jaeger:
    image: jaegertracing/all-in-one:1.60
    container_name: indusense-jaeger
    mem_limit: 512m
    ports:
      - "16686:16686" # UI
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    logging: *default-logging
    networks: [indusense-net]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8080}
    container_name: indusense-frontend
    mem_limit: 1g
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    logging: *default-logging
    networks: [indusense-net]

  # ---------------------------------------------------------------------------
  # Sensor simulator — on-demand only (not part of `docker compose up`).
  # Run with `make simulate` or `docker compose --profile simulate up simulator`.
  # ---------------------------------------------------------------------------
  simulator:
    build:
      context: .
      dockerfile: simulator/Dockerfile
    container_name: indusense-simulator
    mem_limit: 512m
    profiles: ["simulate"]
    environment:
      SIM_POSTGRES_DSN: postgres://${POSTGRES_USER:-indusense}:${POSTGRES_PASSWORD:-indusense_dev_password}@postgres:5432/${POSTGRES_DB:-indusense}?sslmode=disable
      SIM_POSTGRES_MAX_CONNS: ${SIM_POSTGRES_MAX_CONNS:-4}
      SIM_MQTT_BROKER_URL: tcp://mosquitto:1883
      MQTT_QOS: ${MQTT_QOS:-1}
      SENSOR_COUNT: ${SENSOR_COUNT:-1000}
      MESSAGES_PER_SECOND: ${MESSAGES_PER_SECOND:-1000}
      ANOMALY_RATE: ${ANOMALY_RATE:-0.02}
      DUPLICATE_RATE: ${DUPLICATE_RATE:-0.01}
      OUT_OF_ORDER_RATE: ${OUT_OF_ORDER_RATE:-0.02}
      NETWORK_DELAY_RATE: ${NETWORK_DELAY_RATE:-0.03}
      SENSOR_FAILURE_RATE: ${SENSOR_FAILURE_RATE:-0.005}
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
    logging: *default-logging
    networks: [indusense-net]

networks:
  indusense-net:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  mosquitto-data:
  mosquitto-log:
  kafka-data:
  influxdb-data:
  influxdb-config:
  prometheus-data:
  grafana-data:
