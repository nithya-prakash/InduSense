listener 1883
protocol mqtt

listener 9001
protocol websockets

# Development configuration: anonymous access is allowed because the ingestion
# service and simulator run inside the same trusted Docker network. Production
# deployments must configure password_file / TLS certificates.
allow_anonymous true

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information

connection_messages true
