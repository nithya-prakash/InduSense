apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-alert-service
  labels:
    {{- include "indusense.labels" (dict "root" $ "name" "alert-service") | nindent 4 }}
spec:
  replicas: {{ .Values.services.alertService.replicas }}
  selector:
    matchLabels:
      {{- include "indusense.selectorLabels" (dict "root" $ "name" "alert-service") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "indusense.labels" (dict "root" $ "name" "alert-service") | nindent 8 }}
    spec:
      containers:
        - name: alert-service
          image: "{{ .Values.images.alertService.repository }}:{{ .Values.images.alertService.tag }}"
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          ports:
            - containerPort: 8084
          env:
            - name: KAFKA_BROKERS
              value: "{{ .Release.Name }}-kafka:9092"
            - name: KAFKA_CONSUMER_GROUP_PREFIX
              value: {{ .Values.kafkaTopics.clientIDPrefix | quote }}
            - name: KAFKA_TOPIC_ANOMALIES_DETECTED
              value: {{ .Values.kafkaTopics.anomaliesDetected | quote }}
            - name: KAFKA_TOPIC_DEVICE_EVENTS
              value: {{ .Values.kafkaTopics.deviceEvents | quote }}
            - name: KAFKA_TOPIC_ALERTS
              value: {{ .Values.kafkaTopics.alerts | quote }}
            - name: KAFKA_TOPIC_DEAD_LETTER
              value: {{ .Values.kafkaTopics.deadLetter | quote }}
            - name: ALERT_POSTGRES_DSN
              value: {{ include "indusense.postgresDSN" . | quote }}
            - name: ALERT_SERVICE_PORT
              value: "8084"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://{{ .Release.Name }}-jaeger:4318"
          readinessProbe:
            httpGet: { path: /ready, port: 8084 }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /live, port: 8084 }
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            {{- toYaml .Values.services.alertService.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-alert-service
  labels:
    {{- include "indusense.labels" (dict "root" $ "name" "alert-service") | nindent 4 }}
spec:
  selector:
    {{- include "indusense.selectorLabels" (dict "root" $ "name" "alert-service") | nindent 4 }}
  ports:
    - port: 8084
      targetPort: 8084
