apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-anomaly-detector
  labels:
    {{- include "indusense.labels" (dict "root" $ "name" "anomaly-detector") | nindent 4 }}
spec:
  replicas: {{ .Values.services.anomalyDetector.replicas }}
  selector:
    matchLabels:
      {{- include "indusense.selectorLabels" (dict "root" $ "name" "anomaly-detector") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "indusense.labels" (dict "root" $ "name" "anomaly-detector") | nindent 8 }}
    spec:
      containers:
        - name: anomaly-detector
          image: "{{ .Values.images.anomalyDetector.repository }}:{{ .Values.images.anomalyDetector.tag }}"
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          ports:
            - containerPort: 8083
          env:
            - name: KAFKA_BROKERS
              value: "{{ .Release.Name }}-kafka:9092"
            - name: KAFKA_CONSUMER_GROUP_PREFIX
              value: {{ .Values.kafkaTopics.clientIDPrefix | quote }}
            - name: KAFKA_TOPIC_TELEMETRY_PROCESSED
              value: {{ .Values.kafkaTopics.telemetryProcessed | quote }}
            - name: KAFKA_TOPIC_ANOMALIES_DETECTED
              value: {{ .Values.kafkaTopics.anomaliesDetected | quote }}
            - name: KAFKA_TOPIC_DEAD_LETTER
              value: {{ .Values.kafkaTopics.deadLetter | quote }}
            - name: ANOMALY_POSTGRES_DSN
              valueFrom:
                secretKeyRef: { name: {{ .Release.Name }}-secrets, key: POSTGRES_DSN }
            - name: ANOMALY_DETECTOR_PORT
              value: "8083"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://{{ .Release.Name }}-jaeger:4318"
          readinessProbe:
            httpGet: { path: /ready, port: 8083 }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /live, port: 8083 }
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            {{- toYaml .Values.services.anomalyDetector.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-anomaly-detector
  labels:
    {{- include "indusense.labels" (dict "root" $ "name" "anomaly-detector") | nindent 4 }}
spec:
  selector:
    {{- include "indusense.selectorLabels" (dict "root" $ "name" "anomaly-detector") | nindent 4 }}
  ports:
    - port: 8083
      targetPort: 8083
