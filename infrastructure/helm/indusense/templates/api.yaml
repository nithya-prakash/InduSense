apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-api
  labels:
    {{- include "indusense.labels" (dict "root" $ "name" "api") | nindent 4 }}
spec:
  replicas: {{ .Values.services.api.replicas }}
  selector:
    matchLabels:
      {{- include "indusense.selectorLabels" (dict "root" $ "name" "api") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "indusense.labels" (dict "root" $ "name" "api") | nindent 8 }}
    spec:
      containers:
        - name: api
          image: "{{ .Values.images.api.repository }}:{{ .Values.images.api.tag }}"
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          ports:
            - containerPort: 8080
          env:
            - name: API_PORT
              value: "8080"
            - name: API_POSTGRES_DSN
              valueFrom:
                secretKeyRef: { name: {{ .Release.Name }}-secrets, key: POSTGRES_DSN }
            - name: REDIS_HOST
              value: "{{ .Release.Name }}-redis"
            - name: REDIS_PORT
              value: "6379"
            - name: INFLUXDB_URL
              value: "http://{{ .Release.Name }}-influxdb:8086"
            - name: INFLUXDB_TOKEN
              valueFrom:
                secretKeyRef: { name: {{ .Release.Name }}-secrets, key: INFLUXDB_TOKEN }
            - name: INFLUXDB_ORG
              value: {{ .Values.influxdb.org | quote }}
            - name: INFLUXDB_BUCKET
              value: {{ .Values.influxdb.bucket | quote }}
            - name: KAFKA_BROKERS
              value: "{{ .Release.Name }}-kafka:9092"
            - name: KAFKA_TOPIC_ALERTS
              value: {{ .Values.kafkaTopics.alerts | quote }}
            - name: MQTT_BROKER_URL
              value: "tcp://{{ .Release.Name }}-mosquitto:1883"
            - name: JWT_ACCESS_SECRET
              valueFrom:
                secretKeyRef: { name: {{ .Release.Name }}-secrets, key: JWT_ACCESS_SECRET }
            - name: JWT_REFRESH_SECRET
              valueFrom:
                secretKeyRef: { name: {{ .Release.Name }}-secrets, key: JWT_REFRESH_SECRET }
            - name: JWT_ACCESS_TTL_MINUTES
              value: {{ .Values.jwt.accessTTLMinutes | quote }}
            - name: JWT_REFRESH_TTL_HOURS
              value: {{ .Values.jwt.refreshTTLHours | quote }}
            - name: API_CORS_ALLOWED_ORIGINS
              value: {{ .Values.api.corsAllowedOrigins | quote }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://{{ .Release.Name }}-jaeger:4318"
          readinessProbe:
            httpGet: { path: /ready, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /live, port: 8080 }
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            {{- toYaml .Values.services.api.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-api
  labels:
    {{- include "indusense.labels" (dict "root" $ "name" "api") | nindent 4 }}
spec:
  type: {{ .Values.api.service.type }}
  selector:
    {{- include "indusense.selectorLabels" (dict "root" $ "name" "api") | nindent 4 }}
  ports:
    - port: {{ .Values.api.service.port }}
      targetPort: 8080
