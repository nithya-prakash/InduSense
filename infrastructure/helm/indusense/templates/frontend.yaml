# The frontend image already has NEXT_PUBLIC_API_BASE_URL=http://localhost:8080
# baked in at build time (Next.js inlines NEXT_PUBLIC_* vars into the
# client bundle, so a runtime env var here wouldn't do anything) — that
# happens to still be correct because api's Service is also exposed as
# LoadBalancer on localhost:8080 (see api.yaml), the same as Compose.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-frontend
  labels:
    {{- include "indusense.labels" (dict "root" $ "name" "frontend") | nindent 4 }}
spec:
  replicas: {{ .Values.services.frontend.replicas }}
  selector:
    matchLabels:
      {{- include "indusense.selectorLabels" (dict "root" $ "name" "frontend") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "indusense.labels" (dict "root" $ "name" "frontend") | nindent 8 }}
    spec:
      containers:
        - name: frontend
          image: "{{ .Values.images.frontend.repository }}:{{ .Values.images.frontend.tag }}"
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          ports:
            - containerPort: 3000
          readinessProbe:
            tcpSocket: { port: 3000 }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            tcpSocket: { port: 3000 }
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            {{- toYaml .Values.services.frontend.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-frontend
  labels:
    {{- include "indusense.labels" (dict "root" $ "name" "frontend") | nindent 4 }}
spec:
  type: {{ .Values.frontend.service.type }}
  selector:
    {{- include "indusense.selectorLabels" (dict "root" $ "name" "frontend") | nindent 4 }}
  ports:
    - port: {{ .Values.frontend.service.port }}
      targetPort: 3000
