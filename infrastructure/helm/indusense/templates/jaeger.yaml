apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-jaeger
  labels:
    {{- include "indusense.labels" (dict "root" $ "name" "jaeger") | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "indusense.selectorLabels" (dict "root" $ "name" "jaeger") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "indusense.labels" (dict "root" $ "name" "jaeger") | nindent 8 }}
    spec:
      containers:
        - name: jaeger
          image: {{ .Values.jaeger.image }}
          env:
            - name: COLLECTOR_OTLP_ENABLED
              value: "true"
          ports:
            - containerPort: 16686
            - containerPort: 4317
            - containerPort: 4318
          readinessProbe:
            httpGet: { path: /, port: 16686 }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /, port: 16686 }
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            {{- toYaml .Values.jaeger.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-jaeger
  labels:
    {{- include "indusense.labels" (dict "root" $ "name" "jaeger") | nindent 4 }}
spec:
  selector:
    {{- include "indusense.selectorLabels" (dict "root" $ "name" "jaeger") | nindent 4 }}
  ports:
    - { name: ui, port: 16686, targetPort: 16686 }
    - { name: otlp-grpc, port: 4317, targetPort: 4317 }
    - { name: otlp-http, port: 4318, targetPort: 4318 }
