apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-mosquitto-conf
  labels:
    {{- include "indusense.labels" (dict "root" $ "name" "mosquitto") | nindent 4 }}
data:
  mosquitto.conf: |
    listener 1883
    protocol mqtt

    listener 9001
    protocol websockets

    # Development configuration: anonymous access is allowed because every
    # publisher/subscriber runs inside the same trusted cluster network.
    # A real deployment must configure password_file / TLS certificates.
    allow_anonymous true

    persistence true
    persistence_location /mosquitto/data/

    log_dest stdout
    log_type error
    log_type warning
    log_type notice
    log_type information

    connection_messages true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-mosquitto
  labels:
    {{- include "indusense.labels" (dict "root" $ "name" "mosquitto") | nindent 4 }}
spec:
  replicas: 1
  strategy: { type: Recreate } # only one pod may ever hold the persistence volume at a time
  selector:
    matchLabels:
      {{- include "indusense.selectorLabels" (dict "root" $ "name" "mosquitto") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "indusense.labels" (dict "root" $ "name" "mosquitto") | nindent 8 }}
    spec:
      containers:
        - name: mosquitto
          image: {{ .Values.mosquitto.image }}
          ports:
            - containerPort: 1883
            - containerPort: 9001
          volumeMounts:
            - name: conf
              mountPath: /mosquitto/config/mosquitto.conf
              subPath: mosquitto.conf
            - name: data
              mountPath: /mosquitto/data
          readinessProbe:
            tcpSocket: { port: 1883 }
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            tcpSocket: { port: 1883 }
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            {{- toYaml .Values.mosquitto.resources | nindent 12 }}
      volumes:
        - name: conf
          configMap: { name: {{ .Release.Name }}-mosquitto-conf }
        - name: data
          persistentVolumeClaim: { claimName: {{ .Release.Name }}-mosquitto-data }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-mosquitto-data
  labels:
    {{- include "indusense.labels" (dict "root" $ "name" "mosquitto") | nindent 4 }}
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-mosquitto
  labels:
    {{- include "indusense.labels" (dict "root" $ "name" "mosquitto") | nindent 4 }}
spec:
  selector:
    {{- include "indusense.selectorLabels" (dict "root" $ "name" "mosquitto") | nindent 4 }}
  ports:
    - name: mqtt
      port: 1883
      targetPort: 1883
    - name: websockets
      port: 9001
      targetPort: 9001
