apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-prometheus-config
  labels:
    {{- include "indusense.labels" (dict "root" $ "name" "prometheus") | nindent 4 }}
data:
  prometheus.yml: |
    global:
      scrape_interval: 10s
      evaluation_interval: 10s

    scrape_configs:
      - job_name: api
        static_configs:
          - targets: ["{{ .Release.Name }}-api:{{ .Values.api.service.port }}"]

      - job_name: ingestion
        static_configs:
          - targets: ["{{ .Release.Name }}-ingestion:8081"]

      - job_name: stream-processor
        static_configs:
          - targets: ["{{ .Release.Name }}-stream-processor:8082"]

      - job_name: anomaly-detector
        static_configs:
          - targets: ["{{ .Release.Name }}-anomaly-detector:8083"]

      - job_name: alert-service
        static_configs:
          - targets: ["{{ .Release.Name }}-alert-service:8084"]

      # Kafka broker JMX metrics: NOT IMPLEMENTED, same as docker-compose —
      # no JMX exporter sidecar. kafka_consumer_lag per service still comes
      # from each Go consumer's own kafka-go Reader.Stats().
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-prometheus
  labels:
    {{- include "indusense.labels" (dict "root" $ "name" "prometheus") | nindent 4 }}
spec:
  serviceName: {{ .Release.Name }}-prometheus
  replicas: 1
  selector:
    matchLabels:
      {{- include "indusense.selectorLabels" (dict "root" $ "name" "prometheus") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "indusense.labels" (dict "root" $ "name" "prometheus") | nindent 8 }}
    spec:
      containers:
        - name: prometheus
          image: {{ .Values.prometheus.image }}
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.path=/prometheus"
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: data
              mountPath: /prometheus
          readinessProbe:
            httpGet: { path: /-/ready, port: 9090 }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /-/healthy, port: 9090 }
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            {{- toYaml .Values.prometheus.resources | nindent 12 }}
      volumes:
        - name: config
          configMap: { name: {{ .Release.Name }}-prometheus-config }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.prometheus.storageSize }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-prometheus
  labels:
    {{- include "indusense.labels" (dict "root" $ "name" "prometheus") | nindent 4 }}
spec:
  selector:
    {{- include "indusense.selectorLabels" (dict "root" $ "name" "prometheus") | nindent 4 }}
  ports:
    - port: 9090
      targetPort: 9090
