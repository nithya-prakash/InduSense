# Every credential the stack needs, in one Secret. Kept separate from the
# ConfigMaps in this file's neighbors specifically so `kubectl get configmap
# -o yaml` (a command anyone debugging the cluster might run without a
# second thought) never has a chance of printing a password to a terminal
# or CI log.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secrets
  labels:
    {{- include "indusense.labels" (dict "root" $ "name" "secrets") | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ .Values.postgres.password | quote }}
  INFLUXDB_ADMIN_PASSWORD: {{ .Values.influxdb.adminPassword | quote }}
  INFLUXDB_TOKEN: {{ .Values.influxdb.token | quote }}
  GRAFANA_ADMIN_PASSWORD: {{ .Values.grafana.adminPassword | quote }}
  JWT_ACCESS_SECRET: {{ .Values.jwt.accessSecret | quote }}
  JWT_REFRESH_SECRET: {{ .Values.jwt.refreshSecret | quote }}
